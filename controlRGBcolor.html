<!DOCTYPE html>
<html>
<head>
	<title>Cat Feeder - IOT Dashboard</title>
	<meta charset="UTF-8">
	<link rel="stylesheet" type="text/css" href="bower_components/bootstrap/dist/css/bootstrap.min.css">
	<link rel="stylesheet" type="text/css" href="bower_components/snackbarjs/dist/snackbar.min.css">
	<link rel="stylesheet" type="text/css" href="bower_components/titatoggle/dist/titatoggle-dist-min.css">
	<link rel="stylesheet" type="text/css" href="bower_components/bootstrap-material-design/dist/css/roboto.min.css">
	<link rel="stylesheet" type="text/css" href="bower_components/bootstrap-material-design/dist/css/ripples.min.css">
	<link rel="stylesheet" type="text/css" href="bower_components/bootstrap-material-design/dist/css/material-fullpalette.min.css">
	<link rel="stylesheet" type="text/css" href="bower_components/nouislider/distribute/nouislider.min.css">
	<style>
		.timer-card {
			margin: 20px auto;
			max-width: 480px;
			padding: 20px;
			background: #ffffff;
			border-radius: 12px;
			box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
			border: 1px solid #e0e0e0;
		}
		.countdown-text {
			font-size: 36px;
			font-weight: 700;
			color: #009688;
			letter-spacing: 2px;
			margin: 8px 0;
			font-family: 'Roboto', monospace, sans-serif;
		}
		.feed-badge {
			display: inline-block;
			padding: 4px 12px;
			border-radius: 20px;
			background: #e8f5e9;
			color: #2e7d32;
			font-weight: 500;
			font-size: 13px;
		}
	</style>
</head>
<body>
	<div class="container" style="padding-top: 30px; padding-bottom: 50px;">
		<div class="text-center">
			<h1>Publish Service</h1>

			<div style="margin: 15px 0; font-size: 18px;">
				<div>
					<strong>Broker:</strong>
					<span id="broker-name">-</span>
				</div>
				<div>
					<strong>Topic:</strong>
					<span id="topic-name">-</span>
				</div>
			</div>

			<div style="margin: 15px 0;">
				<span id="connection-status" class="label label-danger" style="font-size: 16px;">Disconnected</span>
			</div>
			<button class="btn btn-material-green-500" id="connect-button">Connect</button>
			<button class="btn btn-material-red-500" id="disconnect-button" disabled>Disconnect</button>
			<button class="btn btn-material-indigo-500" id="sync-time-btn" disabled>🕒 Sync Time to Arduino</button>
			
			<hr>

			<!-- Feeding Timer Section -->
			<h3>Set Timer: <span id="value">10</span> นาที (Minutes)</h3>
			<div style="padding: 0 15% 0 15%; margin-bottom: 20px;">
				<div id="slider-handles"></div>
			</div>

			<div style="margin-bottom: 15px;">
				<button class="btn btn-material-cyan-500" id="start-timer-btn" style="min-width: 140px;">
					⏱️ Start Timer
					<div class="ripple-wrapper"></div>
				</button>
				<button class="btn btn-material-deep-orange-500" id="stop-timer-btn" disabled style="min-width: 140px;">
					⏹️ Stop Timer
					<div class="ripple-wrapper"></div>
				</button>
			</div>

			<!-- Timer Status Card -->
			<div class="timer-card">
				<div style="color: #616161; font-size: 14px; text-transform: uppercase; letter-spacing: 1px;">
					Next Feed Countdown
				</div>
				<div class="countdown-text" id="countdown-display">--:--:--</div>
				<div style="margin-top: 10px;">
					<span class="feed-badge">
						🍽️ Last Feed: <span id="last-feed-display">None</span>
					</span>
				</div>
				<div style="margin-top: 12px; font-size: 13px; color: #757575;">
					<label style="cursor: pointer; font-weight: normal;">
						<input type="checkbox" id="auto-repeat-check" checked> วนซ้ำอัตโนมัติ (Auto-repeat timer)
					</label>
				</div>
			</div>

			<!-- Manual Feed Button -->
			<div class="row" style="margin-top: 20px;">
				<div class="col-md-12">
					<button class="btn btn-material-green-A400 publish-button" data-value="FEED" id="manual-feed-btn" style="font-size: 18px; padding: 12px 40px;">
						🍽️ FEED (ให้อาหารทันที)
						<div class="ripple-wrapper"></div>
					</button>
				</div>
			</div>
		</div>
	</div>

	<script type="text/javascript" src="bower_components/jquery/dist/jquery.min.js"></script>
	<script src="mqttws31.js" type="text/javascript"></script>
	<script type="text/javascript" src="bower_components/bootstrap/dist/js/bootstrap.min.js"></script>
	<script type="text/javascript" src="bower_components/nouislider/distribute/nouislider.min.js"></script>
	<script type="text/javascript" src="bower_components/snackbarjs/dist/snackbar.min.js"></script>
	<script type="text/javascript" src="bower_components/bootstrap-material-design/dist/js/material.min.js"></script>
	<script type="text/javascript" src="bower_components/bootstrap-material-design/dist/js/ripples.min.js"></script>
	
	<script type="text/javascript">
		$(function() {
			if ($.material && $.material.init) {
				$.material.init();
			}

			// MQTT Configuration
			var MQTTbroker = 'mqtt-dashboard.com';
			var MQTTport = 8884;
			var MQTTpublishTopic = 'testtopic/iot23';

			$('#broker-name').text(MQTTbroker + ':' + MQTTport);
			$('#topic-name').text(MQTTpublishTopic);

			var client = new Paho.MQTT.Client(MQTTbroker, MQTTport,
				"myclientid_feeder_" + parseInt(Math.random() * 1000, 10));

			var isConnected = false;
			var statusShow = document.getElementById('connection-status');
			var connectButton = document.getElementById('connect-button');
			var disconnectButton = document.getElementById('disconnect-button');
			var syncTimeButton = document.getElementById('sync-time-btn');

			function updateConnectionStatus(connected, message) {
				isConnected = connected;
				$(statusShow).text(message || (connected ? 'Connected' : 'Disconnected'));
				$(statusShow)
					.toggleClass('label-success', connected)
					.toggleClass('label-danger', !connected);
				$(connectButton).prop('disabled', connected);
				$(disconnectButton).prop('disabled', !connected);
				$(syncTimeButton).prop('disabled', !connected);
			}

			client.onConnectionLost = function (responseObject) {
				updateConnectionStatus(false, 'Disconnected');
				console.log("Connection lost: " + responseObject.errorMessage);
			};

			function sendTimeSync() {
				if (!isConnected) return;
				// Send current browser epoch time (UTC seconds)
				var currentEpoch = Math.floor(Date.now() / 1000);
				var timeMsg = new Paho.MQTT.Message("TIME:" + currentEpoch);
				timeMsg.destinationName = MQTTpublishTopic;
				client.send(timeMsg);
				console.log("Sent time sync to Arduino: TIME:" + currentEpoch);
				$.snackbar({content: '🕒 ซิงค์เวลาปัจจุบันไปยังบอร์ด Arduino เรียบร้อย!'});
			}

			function connectMQTT() {
				updateConnectionStatus(false, 'Connecting...');
				var options = {
					timeout: 5,
					onSuccess: function () {
						updateConnectionStatus(true, 'Connected');
						console.log("MQTT connected");
						$.snackbar({content: 'เชื่อมต่อ MQTT สำเร็จ!'});

						// Automatically sync current time to Arduino upon connection
						setTimeout(sendTimeSync, 1000);
					},
					onFailure: function (message) {
						updateConnectionStatus(false, 'Connection Failed');
						console.log("Connection failed: " + message.errorMessage);
						$.snackbar({content: 'เชื่อมต่อ MQTT ไม่สำเร็จ'});
					}
				};
				client.connect(options);
			}

			$(connectButton).click(function () {
				if (!isConnected) connectMQTT();
			});

			$(disconnectButton).click(function () {
				if (isConnected) {
					client.disconnect();
					updateConnectionStatus(false, 'Disconnected');
				}
			});

			$(syncTimeButton).click(function () {
				sendTimeSync();
			});

			// Publish message helper
			function sendFeedCommand() {
				if (!isConnected) {
					$.snackbar({content: 'กรุณากด Connect ก่อนสั่งให้อาหาร'});
					return false;
				}
				var message = new Paho.MQTT.Message("FEED");
				message.destinationName = MQTTpublishTopic;
				client.send(message);

				// Update Last Feed timestamp
				var now = new Date();
				var timeStr = now.toLocaleTimeString();
				$('#last-feed-display').text(timeStr);

				$.snackbar({content: '🍽️ สั่งจ่ายอาหาร (FEED) สำเร็จ!'});
				return true;
			}

			// Manual Feed Button
			$('#manual-feed-btn').click(function(e) {
				e.preventDefault();
				sendFeedCommand();
			});

			// Slider Initialization (1 to 60 minutes)
			var rangeSlider = document.getElementById('slider-handles');
			var valueShow = document.getElementById('value');
			var selectedMinutes = 10;

			noUiSlider.create(rangeSlider, {
				start: 10,
				connect: "lower",
				step: 1,
				range: {
					'min': 1,
					'max': 60
				}
			});

			rangeSlider.noUiSlider.on('update', function(values, handle) {
				selectedMinutes = parseInt(values[handle], 10);
				$(valueShow).text(selectedMinutes);
			});

			// Timer & Countdown Logic
			var countdownTimer = null;
			var remainingSeconds = 0;

			function formatTime(totalSeconds) {
				var h = Math.floor(totalSeconds / 3600);
				var m = Math.floor((totalSeconds % 3600) / 60);
				var s = totalSeconds % 60;
				var pad = function(n) { return (n < 10 ? '0' : '') + n; };
				return pad(h) + ':' + pad(m) + ':' + pad(s);
			}

			function updateCountdownDisplay() {
				if (remainingSeconds <= 0) {
					$('#countdown-display').text('00:00:00');
				} else {
					$('#countdown-display').text(formatTime(remainingSeconds));
				}
			}

			$('#start-timer-btn').click(function() {
				if (!isConnected) {
					$.snackbar({content: 'กรุณากด Connect MQTT ก่อนเริ่มตั้งเวลา'});
					return;
				}

				if (countdownTimer) {
					clearInterval(countdownTimer);
				}

				remainingSeconds = selectedMinutes * 60;
				updateCountdownDisplay();

				$('#start-timer-btn').prop('disabled', true);
				$('#stop-timer-btn').prop('disabled', false);
				$.snackbar({content: '⏱️ เริ่มนับถอยหลัง ' + selectedMinutes + ' นาที'});

				countdownTimer = setInterval(function() {
					remainingSeconds--;
					updateCountdownDisplay();

					if (remainingSeconds <= 0) {
						sendFeedCommand();
						
						var autoRepeat = $('#auto-repeat-check').is(':checked');
						if (autoRepeat) {
							remainingSeconds = selectedMinutes * 60;
							updateCountdownDisplay();
							$.snackbar({content: '⏰ ครบรอบเวลา! ให้อาหารและเริ่มรอบถัดไป'});
						} else {
							clearInterval(countdownTimer);
							countdownTimer = null;
							$('#start-timer-btn').prop('disabled', false);
							$('#stop-timer-btn').prop('disabled', true);
							$('#countdown-display').text('--:--:--');
							$.snackbar({content: '⏰ ครบเวลาให้อาหารแล้ว!'});
						}
					}
				}, 1000);
			});

			$('#stop-timer-btn').click(function() {
				if (countdownTimer) {
					clearInterval(countdownTimer);
					countdownTimer = null;
				}
				$('#start-timer-btn').prop('disabled', false);
				$('#stop-timer-btn').prop('disabled', true);
				$('#countdown-display').text('--:--:--');
				$.snackbar({content: '⏹️ หยุดการนับเวลาแล้ว'});
			});
		});
	</script>
</body>
</html>
